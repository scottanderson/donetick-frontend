name: Build validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: 20.x
        cache: 'npm'
    - name: Install dependencies
      run: npm i
    - run: npm run build
